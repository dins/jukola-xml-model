[project]
name = "jukola-xml-model"
version = "0.1.0"
description = ""
authors = [
    { name = "Oskari Pirttikoski" }
]
requires-python = ">=3.13,<3.15"
dependencies = [
    "scikit-learn>=1.2.0,<2",
    "seaborn>=0.13.2,<1",
    "lxml>=5.1.0,<6",
    "requests>=2.28.1,<3",
    "jupyter>=1.0.0,<2",
    "statsmodels>=0.14.1,<1",
    "scikit-optimize>=0.10.0,<1",
    "xmltodict>=0.13.0,<1",
    "pandas>=2.3.3,<3",
    "polars>=1.39.3",
    "ngboost>=0.5.10",
    "properscoring>=0.1",
    "pyarrow>=23.0.1",
    "optuna>=4.8.0",
    "optuna-dashboard>=0.20.0",
    "rapidfuzz>=3.14.5",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.16",
    "ty>=0.0.44",
]

[tool.pytest.ini_options]
markers = [
    "testdata: mark test with a test data fixture name",
]