[project]
name = "jukola-xml-model"
version = "0.1.0"
description = ""
authors = [
    { name = "Oskari Pirttikoski" }
]
requires-python = ">=3.13,<3.16"
dependencies = [
    "scikit-learn>=1.2.0,<2",
    "seaborn>=0.13.2,<1",
    "lxml>=6.0.0,<7",
    "requests>=2.28.1,<3",
    "jupyter>=1.0.0,<2",
    "scikit-optimize>=0.10.0,<1",
    "xmltodict>=1.0.4",
    "pandas>=3.0.0,<4",
    "polars>=2.0.0",
    # 0.6.0 has some backwards incomaptible fixes to TFixedDf
    "ngboost>=0.5.10,<0.6.0",
    "properscoring>=0.1",
    "pyarrow>=23.0.1",
    "optuna>=4.8.0",
    "optuna-dashboard>=0.20.0",
    "rapidfuzz>=3.14.5",
    "numpy>=2.5.4",
    "matplotlib>=3.11.2",
    "scipy>=1.18.1",
]

[dependency-groups]
dev = [
    "deptry>=0.25.1",
    "pytest>=9.0.3",
    "ruff>=0.15.16",
    "ty>=0.0.44",
]

[tool.pytest.ini_options]
markers = [
    "testdata: mark test with a test data fixture name",
]

[tool.deptry.per_rule_ignores]
DEP002 = [
    "jupyter",
    "optuna-dashboard",
    "scikit-optimize",
    "pyarrow",
]

[tool.ruff.lint]
extend-select = ["C4", "UP"] # no "SIM",
