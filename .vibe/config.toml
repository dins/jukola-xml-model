applied_migrations = [
    "bash_read_only_defaults_v1",
]

[tools.bash]
permission = "ask"
allowlist = [
    "./run-all-local-checks.sh",
    "basename",
    "cat",
    "comm",
    "cut",
    "date",
    "diff",
    "dirname",
    "du",
    "echo",
    "file",
    "find",
    "fmt",
    "fold",
    "git diff",
    "git log",
    "git status",
    "rg",
    "grep",
    "head",
    "join",
    "less",
    "ls",
    "md5sum",
    "more",
    "nl",
    "od",
    "paste",
    "pwd",
    "readlink",
    "sha1sum",
    "sha256sum",
    "shasum",
    "sleep",
    "sort",
    "stat",
    "sum",
    "tac",
    "tail",
    "tr",
    "tree",
    "uname",
    "uniq",
    "uv run pytest",
    "uv run ruff",
    "uv run ty",
    "wc",
    "which",
    "whoami",
]
